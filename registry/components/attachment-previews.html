<section
  aria-labelledby="nyx-attachment-previews-title"
  class="nyx-attachment-previews"
  data-nyx-attachment-previews
>
  <header class="nyx-attachment-header">
    <div>
      <span class="nyx-eyebrow">// Prompt context</span>
      <h2 id="nyx-attachment-previews-title">Attachments</h2>
    </div>
    <output data-nyx-attachment-count>3 attachments</output>
  </header>
  <ul aria-label="Attached files" class="nyx-attachment-list">
    <li class="nyx-attachment-preview" data-nyx-attachment-preview data-nyx-attachment-id="dashboard-capture" data-state="active">
      <div class="nyx-attachment-thumbnail" data-kind="image" aria-hidden="true"><span>PNG</span></div>
      <div class="nyx-attachment-body">
        <strong>dashboard-capture.png</strong>
        <span>1.8 MB · 1440 × 900</span>
      </div>
      <button aria-label="Remove dashboard-capture.png" class="nyx-button nyx-attachment-remove" data-nyx-attachment-remove data-size="small" data-variant="quiet" type="button">Remove</button>
    </li>
    <li class="nyx-attachment-preview" data-nyx-attachment-preview data-nyx-attachment-id="release-notes" data-state="active">
      <div class="nyx-attachment-thumbnail" data-kind="document" aria-hidden="true"><span>PDF</span></div>
      <div class="nyx-attachment-body">
        <strong>release-notes.pdf</strong>
        <span>842 KB · 12 pages</span>
      </div>
      <button aria-label="Remove release-notes.pdf" class="nyx-button nyx-attachment-remove" data-nyx-attachment-remove data-size="small" data-variant="quiet" type="button">Remove</button>
    </li>
    <li class="nyx-attachment-preview" data-nyx-attachment-preview data-nyx-attachment-id="audit-sample" data-state="active">
      <div class="nyx-attachment-thumbnail" data-kind="data" aria-hidden="true"><span>CSV</span></div>
      <div class="nyx-attachment-body">
        <strong>audit-sample.csv</strong>
        <span>96 KB · 320 rows</span>
      </div>
      <button aria-label="Remove audit-sample.csv" class="nyx-button nyx-attachment-remove" data-nyx-attachment-remove data-size="small" data-variant="quiet" type="button">Remove</button>
    </li>
  </ul>
  <p class="nyx-attachment-empty" data-nyx-attachment-empty hidden>No attachments selected.</p>
</section>
