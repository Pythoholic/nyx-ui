<fieldset class="nyx-model-selector" data-nyx-model-selector>
  <legend>
    <span class="nyx-eyebrow">// Inference profile</span>
    <strong>Model</strong>
  </legend>
  <div class="nyx-model-options">
    <label class="nyx-model-option" data-nyx-model-option>
      <input data-nyx-model-value name="model" type="radio" value="swift">
      <span class="nyx-model-option-body"><strong>Swift</strong><span>Fast drafts and iteration</span></span>
      <span class="nyx-badge">Low latency</span>
    </label>
    <label class="nyx-model-option" data-nyx-model-option>
      <input data-nyx-model-value name="model" type="radio" value="balanced" checked>
      <span class="nyx-model-option-body"><strong>Balanced</strong><span>General generation work</span></span>
      <span class="nyx-badge" data-tone="success">Recommended</span>
    </label>
    <label class="nyx-model-option" data-nyx-model-option>
      <input data-nyx-model-value name="model" type="radio" value="precision">
      <span class="nyx-model-option-body"><strong>Precision</strong><span>Maximum detail and adherence</span></span>
      <span class="nyx-badge">High fidelity</span>
    </label>
  </div>
</fieldset>
