<form class="nyx-panel" aria-labelledby="nyx-password-title">
  <div class="nyx-panel-body">
    <label class="nyx-field" id="nyx-password-title" for="nyx-password-control">
      <span class="nyx-label">Deployment passphrase</span>
      <span class="nyx-field-hint" id="nyx-password-hint">Use a unique passphrase. Strength feedback is guidance, not a security guarantee.</span>
    </label>
    <div class="nyx-password" data-nyx-password data-nyx-password-min-length="12" data-state="empty" data-visibility="hidden">
      <div class="nyx-password-control">
        <input
          aria-describedby="nyx-password-hint nyx-password-status"
          autocomplete="new-password"
          class="nyx-input"
          data-nyx-password-control
          id="nyx-password-control"
          minlength="12"
          name="passphrase"
          required
          type="password"
        />
        <button class="nyx-button nyx-password-toggle" data-nyx-password-toggle type="button" aria-controls="nyx-password-control" aria-label="Show password" aria-pressed="false">
          <span data-nyx-password-toggle-label>Show</span>
        </button>
      </div>
      <div class="nyx-password-feedback">
        <meter aria-label="Password strength" class="nyx-password-meter" data-nyx-password-meter min="0" max="4" low="2" high="3" optimum="4" value="0"></meter>
        <span class="nyx-password-status" data-nyx-password-status id="nyx-password-status" aria-live="polite">Enter a password</span>
      </div>
    </div>
    <button class="nyx-button" data-variant="primary" type="submit">Set passphrase</button>
  </div>
</form>
