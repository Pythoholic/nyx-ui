<div
  class="nyx-context-menu-target"
  data-nyx-context-menu="nyx-canvas-context-menu"
>
  Right-click here, or focus this region and press the Context Menu key or Shift+F10.
</div>
<div
  aria-label="Canvas actions"
  class="nyx-popover nyx-menu"
  data-nyx-dropdown-menu
  id="nyx-canvas-context-menu"
  popover
>
  <button class="nyx-menu-item" role="menuitem" type="button">Duplicate</button>
  <button class="nyx-menu-item" role="menuitem" type="button">Rename</button>
  <div class="nyx-menu-separator" role="separator"></div>
  <button class="nyx-menu-item" data-tone="danger" role="menuitem" type="button">Delete</button>
</div>
