    <span class="nyx-status-indicator" data-state="active" data-tone="success">
      <span aria-hidden="true" class="nyx-status-dot"></span>
      API online
    </span>
  </li>
  <li>
    <span class="nyx-status-indicator" data-state="pending" data-tone="neutral">
      <span aria-hidden="true" class="nyx-status-dot"></span>
      Indexing
    </span>
  </li>
  <li>
    <span class="nyx-status-indicator" data-state="warning" data-tone="warning">

    </span>

  <li>
    <span class="nyx-status-indicator" data-state="inactive" data-tone="danger">

    </span>
