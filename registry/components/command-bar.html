<div aria-label="Document commands" class="nyx-command-bar" data-nyx-command-bar role="toolbar">
  <div class="nyx-command-bar-group" role="group" aria-label="File">
    <button class="nyx-button" data-nyx-command data-size="small" data-value="new" type="button">New</button>
    <button class="nyx-button" data-nyx-command data-size="small" data-value="save" type="button">
      Save <kbd class="nyx-kbd" aria-hidden="true">Ctrl S</kbd>
    </button>
  </div>
  <span aria-orientation="vertical" class="nyx-command-bar-separator" role="separator"></span>
  <div class="nyx-command-bar-group" role="group" aria-label="History">
    <button class="nyx-button" data-nyx-command data-size="small" data-value="undo" type="button">Undo</button>
    <button class="nyx-button" data-nyx-command data-size="small" data-value="redo" disabled type="button">Redo</button>
  </div>
  <div class="nyx-command-bar-end">
    <button class="nyx-button" data-nyx-command data-size="small" data-value="share" data-variant="primary" type="button">Share</button>
  </div>
</div>
