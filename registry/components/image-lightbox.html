<section class="nyx-image-lightbox" data-nyx-image-lightbox data-nyx-image-lightbox-loop aria-label="Mission image gallery">
  <div class="nyx-image-lightbox-grid">
    <button class="nyx-image-lightbox-trigger" data-nyx-image-lightbox-trigger type="button" aria-label="Open orbital relay image">
      <img
        alt="Orbital relay silhouetted above a blue planet"
        height="360"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Crect width='640' height='360' fill='%23050b14'/%3E%3Ccircle cx='500' cy='80' r='180' fill='%23152d43'/%3E%3Ccircle cx='500' cy='80' r='130' fill='%23255775'/%3E%3Cpath d='M80 260h280l-50-35H130z' fill='%23e8eef2'/%3E%3Cpath d='M205 115h30v145h-30zM140 150h160v18H140z' fill='%23f2d84b'/%3E%3C/svg%3E"
        width="640"
      />
      <span data-nyx-image-lightbox-trigger-caption>Orbital relay / telemetry pass 04</span>
    </button>
    <button class="nyx-image-lightbox-trigger" data-nyx-image-lightbox-trigger type="button" aria-label="Open lunar terminal image">
      <img
        alt="Lunar terminal lit against a dark ridge"
        height="360"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Crect width='640' height='360' fill='%23070a0d'/%3E%3Cpath d='M0 280 160 170l120 70 130-150 230 190v80H0z' fill='%23212b32'/%3E%3Cpath d='M250 250h180v55H250zM285 145h110v105H285z' fill='%23d7e1e8'/%3E%3Crect x='302' y='175' width='76' height='40' fill='%23f2d84b'/%3E%3C/svg%3E"
        width="640"
      />
      <span data-nyx-image-lightbox-trigger-caption>Lunar terminal / night approach</span>
    </button>
    <button class="nyx-image-lightbox-trigger" data-nyx-image-lightbox-trigger type="button" aria-label="Open survey vessel image">
      <img
        alt="Survey vessel crossing a violet nebula"
        height="360"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop stop-color='%236a3f80'/%3E%3Cstop offset='1' stop-color='%23070a12'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='640' height='360' fill='url(%23g)'/%3E%3Cpath d='m125 205 280-75 120 50-120 48z' fill='%23dce7ed'/%3E%3Cpath d='m205 184 165-25 45 27-190 20z' fill='%23202a31'/%3E%3Ccircle cx='525' cy='180' r='8' fill='%23f2d84b'/%3E%3C/svg%3E"
        width="640"
      />
      <span data-nyx-image-lightbox-trigger-caption>Survey vessel / nebula transect</span>
    </button>
  </div>
  <dialog
    aria-labelledby="nyx-image-lightbox-caption"
    class="nyx-image-lightbox-dialog"
    data-nyx-image-lightbox-dialog
    id="nyx-mission-lightbox"
  >
    <header class="nyx-image-lightbox-header">
      <output data-nyx-image-lightbox-status aria-live="polite">Image 1 of 3</output>
      <button class="nyx-button nyx-icon-button" data-nyx-dialog-close data-size="small" data-variant="quiet" type="button" aria-label="Close image viewer">&times;</button>
    </header>
    <figure class="nyx-image-lightbox-figure">
      <img data-nyx-image-lightbox-image alt="" />
      <figcaption data-nyx-image-lightbox-caption id="nyx-image-lightbox-caption"></figcaption>
    </figure>
    <div class="nyx-image-lightbox-controls">
      <button class="nyx-button" data-nyx-image-lightbox-previous data-size="small" type="button">Previous</button>
      <button class="nyx-button" data-nyx-image-lightbox-next data-size="small" type="button">Next</button>
    </div>
  </dialog>
</section>
