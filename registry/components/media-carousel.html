<section class="nyx-carousel nyx-media-carousel" data-nyx-carousel data-nyx-carousel-loop aria-label="Selected media">
  <div class="nyx-carousel-viewport">
    <figure class="nyx-carousel-slide nyx-media-carousel-slide" data-nyx-carousel-slide data-state="active" id="media-carousel-orbit">
      <div class="nyx-media-carousel-art" data-scene="orbit" role="img" aria-label="Orbital relay concept"></div>
      <figcaption><strong>Orbital relay</strong><span>Concept 04 / approved</span></figcaption>
    </figure>
    <figure class="nyx-carousel-slide nyx-media-carousel-slide" data-nyx-carousel-slide id="media-carousel-terminal">
      <div class="nyx-media-carousel-art" data-scene="terminal" role="img" aria-label="Lunar terminal concept"></div>
      <figcaption><strong>Lunar terminal</strong><span>Concept 07 / review</span></figcaption>
    </figure>
    <figure class="nyx-carousel-slide nyx-media-carousel-slide" data-nyx-carousel-slide id="media-carousel-vessel">
      <div class="nyx-media-carousel-art" data-scene="vessel" role="img" aria-label="Survey vessel concept"></div>
      <figcaption><strong>Survey vessel</strong><span>Concept 11 / queued</span></figcaption>
    </figure>
  </div>
  <div class="nyx-carousel-controls">
    <button class="nyx-button" data-nyx-carousel-previous data-size="small" type="button">Previous</button>
    <span class="nyx-carousel-status" data-nyx-carousel-status aria-live="polite" aria-atomic="true"></span>
    <button class="nyx-button" data-nyx-carousel-next data-size="small" type="button">Next</button>
  </div>
  <div class="nyx-carousel-indicators" aria-label="Choose media">
    <button data-nyx-carousel-go-to="0" type="button"><span class="sr-only">Show orbital relay</span></button>
    <button data-nyx-carousel-go-to="1" type="button"><span class="sr-only">Show lunar terminal</span></button>
    <button data-nyx-carousel-go-to="2" type="button"><span class="sr-only">Show survey vessel</span></button>
  </div>
</section>
