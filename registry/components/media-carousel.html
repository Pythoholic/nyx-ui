<section class="nyx-carousel nyx-media-carousel" data-nyx-carousel data-nyx-carousel-loop aria-label="Selected media">
  <div class="nyx-carousel-viewport">
    <figure class="nyx-carousel-slide nyx-media-carousel-slide" data-nyx-carousel-slide data-state="active" id="media-carousel-orbit">
      <img class="nyx-media-carousel-art" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Crect width='640' height='360' fill='%23050b14'/%3E%3Ccircle cx='500' cy='80' r='180' fill='%23152d43'/%3E%3Ccircle cx='500' cy='80' r='130' fill='%23255775'/%3E%3Cpath d='M80 260h280l-50-35H130z' fill='%23e8eef2'/%3E%3Cpath d='M205 115h30v145h-30zM140 150h160v18H140z' fill='%23f2d84b'/%3E%3C/svg%3E" alt="Orbital relay silhouetted above a blue planet" width="640" height="360" />
      <figcaption><strong>Orbital relay</strong><span>Concept 04 / approved</span></figcaption>
    </figure>
    <figure class="nyx-carousel-slide nyx-media-carousel-slide" data-nyx-carousel-slide id="media-carousel-terminal">
      <img class="nyx-media-carousel-art" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Crect width='640' height='360' fill='%23070a0d'/%3E%3Cpath d='M0 280 160 170l120 70 130-150 230 190v80H0z' fill='%23212b32'/%3E%3Cpath d='M250 250h180v55H250zM285 145h110v105H285z' fill='%23d7e1e8'/%3E%3Crect x='302' y='175' width='76' height='40' fill='%23f2d84b'/%3E%3C/svg%3E" alt="Lunar terminal lit against a dark ridge" width="640" height="360" />
      <figcaption><strong>Lunar terminal</strong><span>Concept 07 / review</span></figcaption>
    </figure>
    <figure class="nyx-carousel-slide nyx-media-carousel-slide" data-nyx-carousel-slide id="media-carousel-vessel">
      <img class="nyx-media-carousel-art" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop stop-color='%236a3f80'/%3E%3Cstop offset='1' stop-color='%23070a12'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='640' height='360' fill='url(%23g)'/%3E%3Cpath d='m125 205 280-75 120 50-120 48z' fill='%23dce7ed'/%3E%3Cpath d='m205 184 165-25 45 27-190 20z' fill='%23202a31'/%3E%3Ccircle cx='525' cy='180' r='8' fill='%23f2d84b'/%3E%3C/svg%3E" alt="Survey vessel crossing a violet nebula" width="640" height="360" />
      <figcaption><strong>Survey vessel</strong><span>Concept 11 / queued</span></figcaption>
    </figure>
  </div>
  <div class="nyx-carousel-controls">
    <button class="nyx-button" data-nyx-carousel-previous data-size="small" type="button">Previous</button>
    <span class="nyx-carousel-status" data-nyx-carousel-status aria-live="polite" aria-atomic="true"></span>
    <button class="nyx-button" data-nyx-carousel-next data-size="small" type="button">Next</button>
  </div>
  <div class="nyx-carousel-indicators" aria-label="Choose media">
    <button data-nyx-carousel-go-to="0" type="button"><span class="sr-only">Show orbital relay</span></button>
    <button data-nyx-carousel-go-to="1" type="button"><span class="sr-only">Show lunar terminal</span></button>
    <button data-nyx-carousel-go-to="2" type="button"><span class="sr-only">Show survey vessel</span></button>
  </div>
</section>
