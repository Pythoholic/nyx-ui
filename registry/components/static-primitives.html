<section class="nyx-panel" aria-labelledby="nyx-card-title">
  <header class="nyx-panel-header">
    <div>
      <span class="nyx-eyebrow">Workspace</span>
      <h3 class="nyx-panel-title" id="nyx-card-title">Night operations</h3>
    </div>
    <span class="nyx-badge" data-tone="success">Online</span>
  </header>
  <div class="nyx-panel-body">
    <p class="nyx-panel-description">
      The panel anatomy is Nyx's canonical card: header, body, and optional footer.
    </p>
    <ul class="nyx-avatar-group" aria-label="On-call operators">
      <li>
        <img
          alt="Mara Voss"
          class="nyx-avatar"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23121a1f'/%3E%3Ccircle cx='32' cy='24' r='12' fill='%23a8b4b8'/%3E%3Cpath d='M8 64c2-17 13-24 24-24s22 7 24 24' fill='%237f8d93'/%3E%3C/svg%3E"
        />
      </li>
      <li><span class="nyx-avatar" role="img" aria-label="Iris Kim">IK</span></li>
      <li><span class="nyx-avatar" role="img" aria-label="Noah Hale">NH</span></li>
    </ul>
    <hr class="nyx-separator" />
    <p class="nyx-panel-description">
      Save changes with
      <kbd class="nyx-kbd-chord"><kbd class="nyx-kbd">Ctrl</kbd><span>+</span><kbd class="nyx-kbd">S</kbd></kbd>.
    </p>
  </div>
  <footer class="nyx-panel-footer">
    <button class="nyx-button" type="button">Review</button>
  </footer>
</section>

<section class="nyx-list-group" aria-labelledby="nyx-recent-title">
  <h3 class="nyx-list-group-label" id="nyx-recent-title">Recent activity</h3>
  <ul class="nyx-list">
    <li class="nyx-item">
      <span class="nyx-item-content">
        <strong class="nyx-item-title">Deploy edge worker</strong>
        <span class="nyx-item-description">Tokyo region &middot; 4 minutes ago</span>
      </span>
      <span class="nyx-badge" data-tone="success">Ready</span>
    </li>
    <li class="nyx-item">
      <span class="nyx-item-content">
        <strong class="nyx-item-title">Rotate access key</strong>
        <span class="nyx-item-description">Security queue &middot; awaiting review</span>
      </span>
      <button class="nyx-button" data-size="small" type="button">Open</button>
    </li>
  </ul>
</section>
