<button
  class="nyx-button"
  data-nyx-dialog-trigger="nyx-example-dialog"
  data-variant="primary"
  type="button"
>
  Open dialog
</button>
<button
  class="nyx-button"
  data-nyx-dialog-trigger="nyx-example-drawer"
  type="button"
>
  Open drawer
</button>

<dialog
  aria-describedby="nyx-example-dialog-description"
  aria-labelledby="nyx-example-dialog-title"
  class="nyx-dialog"
  data-nyx-dialog
  data-nyx-dialog-initial-focus="#nyx-example-change-note"
  id="nyx-example-dialog"
>
  <header class="nyx-dialog-header">
    <div>
      <span class="nyx-eyebrow">Confirmation</span>
      <h2 class="nyx-dialog-title" id="nyx-example-dialog-title">Apply configuration?</h2>
    </div>
    <button
      aria-label="Close dialog"
      class="nyx-button nyx-icon-button"
      data-nyx-dialog-close
      data-variant="quiet"
      type="button"
    >
      <svg aria-hidden="true" class="nyx-icon" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </header>
  <div class="nyx-dialog-body">
    <p class="nyx-dialog-description" id="nyx-example-dialog-description">
      The new configuration will become active immediately.
    </p>
    <label class="nyx-field" for="nyx-example-change-note">
      <span class="nyx-label">Change note</span>
      <input
        class="nyx-input"
        id="nyx-example-change-note"
        placeholder="Describe this change"
      />
    </label>
  </div>
  <footer class="nyx-dialog-footer">
    <button class="nyx-button" data-nyx-dialog-close type="button">Cancel</button>
    <button class="nyx-button" data-variant="primary" type="button">Apply</button>
  </footer>
</dialog>

<dialog
  aria-labelledby="nyx-example-drawer-title"
  class="nyx-dialog"
  data-layout="drawer"
  data-nyx-dialog
  id="nyx-example-drawer"
>
  <header class="nyx-dialog-header">
    <h2 class="nyx-dialog-title" id="nyx-example-drawer-title">Record details</h2>
    <button
      aria-label="Close drawer"
      class="nyx-button nyx-icon-button"
      data-nyx-dialog-close
      data-variant="quiet"
      type="button"
    >
      <svg aria-hidden="true" class="nyx-icon" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </header>
  <div class="nyx-dialog-body">
    <dl class="nyx-description-list">
      <dt>Status</dt><dd>Operational</dd>
      <dt>Region</dt><dd>Tokyo</dd>
      <dt>Version</dt><dd>0.2.0-beta.1</dd>
    </dl>
  </div>
</dialog>
