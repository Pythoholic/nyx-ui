<span class="nyx-tooltip-wrap">
  <button class="nyx-button nyx-icon-button" type="button" aria-label="Open settings">
    <svg aria-hidden="true" class="nyx-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" />
      <path d="M12 2v3m0 14v3M2 12h3m14 0h3" />
    </svg>
  </button>
  <span class="nyx-tooltip" role="tooltip">Workspace settings</span>
</span>

<button class="nyx-button" type="button" popovertarget="nyx-action-menu">
  Open menu
  <svg aria-hidden="true" class="nyx-icon" viewBox="0 0 24 24">
    <path d="m7 10 5 5 5-5" />
  </svg>
</button>
<div class="nyx-popover" id="nyx-action-menu" popover>
  <div class="nyx-menu">
    <button class="nyx-menu-item" type="button">Duplicate <kbd>Ctrl D</kbd></button>
    <button class="nyx-menu-item" type="button">Archive <kbd>Ctrl A</kbd></button>
    <button class="nyx-menu-item" style="color: var(--nyx-danger)" type="button">Delete</button>
  </div>
</div>
