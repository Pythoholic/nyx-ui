name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build, and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enable package manager
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      # test:ci shares the local test entry point, which prepares plugin exports
      # before starting either browser-test server.
      - name: Prepare dependencies and test unit and browser coverage
        run: pnpm test:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify publishable packages
        run: pnpm packages:check

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
